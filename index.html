<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проект ИТИС: Онлайн-обучение</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        h2 { color: #34495e; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .section { margin-bottom: 40px; }

        input[type="number"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 200px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }

        .result-box { margin-top: 15px; padding: 15px; background: #ecf0f1; border-radius: 5px; display: none; }
        .error { color: #e74c3c; font-weight: bold; }
        .success { color: #27ae60; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎓 Система анализа онлайн-обучения</h1>
    <p style="text-align: center;">Гапонова Ольга Сергеевна | ИТИС</p>

    <!-- Секция поиска -->
    <div class="section">
        <h2>🔍 Поиск по ID (Hash Map)</h2>
        <p>Введите interaction_id для мгновенного поиска через вашу Hash Table:</p>
        <input type="number" id="searchId" placeholder="Например: 12345">
        <button onclick="performSearch()">Найти</button>

        <div id="searchResult" class="result-box"></div>
    </div>

    <!-- Секция аналитики -->
    <div class="section">
        <h2>📈 Аналитика оценок (Segment Tree)</h2>
        <p>Укажите диапазон индексов (от 0 до {{ df_len }}) для поиска максимальной оценки:</p>
        <input type="number" id="rangeL" value="0" style="width: 80px;">
        <span>до</span>
        <input type="number" id="rangeR" value="1000" style="width: 80px;">
        <button onclick="getAnalytics()">Узнать MAX</button>

        <div id="analyticsResult" class="result-box"></div>
    </div>
</div>

<script>
    async function performSearch() {
        const id = document.getElementById('searchId').value;
        const resBox = document.getElementById('searchResult');

        const response = await fetch('/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        const data = await response.json();

        resBox.style.display = 'block';
        if (data.found) {
            let html = '<div class="success">Запись найдена!</div><table>';
            for (const [key, value] of Object.entries(data.data)) {
                html += `<tr><td><b>${key}</b></td><td>${value}</td></tr>`;
            }
            html += '</table>';
            resBox.innerHTML = html;
        } else {
            resBox.innerHTML = '<div class="error">Запись не найдена.</div>';
        }
    }

    async function getAnalytics() {
        const l = document.getElementById('rangeL').value;
        const r = document.getElementById('rangeR').value;
        const resBox = document.getElementById('analyticsResult');

        const response = await fetch('/analytics', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({l: l, r: r})
        });
        const data = await response.json();

        resBox.style.display = 'block';
        resBox.innerHTML = `<div class="success">Максимальная оценка на отрезке [${l}, ${r}]: <b>${data.max_score}</b></div>`;
    }
</script>

</body>
</html>
